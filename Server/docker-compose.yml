# docker compose up -d   →   http://localhost:8080 (dashboard), POST /api/v1/reports (apps)
services:
  snag:
    image: ghcr.io/creaturesurvive/snag-server:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - snag-data:/data
    environment:
      # Dashboard login (user "admin"). Create projects and their ingest keys there.
      SNAG_ADMIN_PASSWORD: ${SNAG_ADMIN_PASSWORD:?set SNAG_ADMIN_PASSWORD in .env}
      # Optional: projects from config (app:key,app2:key2) and/or a projects file.
      SNAG_API_KEYS: ${SNAG_API_KEYS:-}
      SNAG_PROJECTS_FILE: ${SNAG_PROJECTS_FILE:-}
      # The URL people use to reach this server; used for links in forwarded reports.
      SNAG_PUBLIC_URL: ${SNAG_PUBLIC_URL:-}
      # Set to true behind a reverse proxy so rate limiting sees real client IPs.
      SNAG_TRUST_PROXY: ${SNAG_TRUST_PROXY:-false}
      SNAG_RETENTION_DAYS: ${SNAG_RETENTION_DAYS:-0}
      # GitHub (default token for projects; webhook secret enables two-way sync webhooks)
      SNAG_GITHUB_WEBHOOK_SECRET: ${SNAG_GITHUB_WEBHOOK_SECRET:-}
      # Notifications (defaults for projects from SNAG_API_KEYS)
      SNAG_NTFY_URL: ${SNAG_NTFY_URL:-}
      SNAG_PUSHOVER_USER: ${SNAG_PUSHOVER_USER:-}
      SNAG_PUSHOVER_TOKEN: ${SNAG_PUSHOVER_TOKEN:-}
      SNAG_SMTP_REPLY_TO: ${SNAG_SMTP_REPLY_TO:-}
      # Forwarding defaults for projects from SNAG_API_KEYS (all optional)
      SNAG_GITHUB_TOKEN: ${SNAG_GITHUB_TOKEN:-}
      SNAG_GITHUB_REPO: ${SNAG_GITHUB_REPO:-}
      SNAG_GITHUB_ATTACHMENT_BRANCH: ${SNAG_GITHUB_ATTACHMENT_BRANCH:-}
      SNAG_DISCORD_WEBHOOK: ${SNAG_DISCORD_WEBHOOK:-}
      SNAG_SLACK_WEBHOOK: ${SNAG_SLACK_WEBHOOK:-}
      SNAG_WEBHOOK_URL: ${SNAG_WEBHOOK_URL:-}
      SNAG_WEBHOOK_SECRET: ${SNAG_WEBHOOK_SECRET:-}
      SNAG_SMTP_HOST: ${SNAG_SMTP_HOST:-}
      SNAG_SMTP_PORT: ${SNAG_SMTP_PORT:-587}
      SNAG_SMTP_USERNAME: ${SNAG_SMTP_USERNAME:-}
      SNAG_SMTP_PASSWORD: ${SNAG_SMTP_PASSWORD:-}
      SNAG_SMTP_FROM: ${SNAG_SMTP_FROM:-}
      SNAG_SMTP_TO: ${SNAG_SMTP_TO:-}
      # Reporters' email replies (see README: Email replies)
      SNAG_INBOUND_EMAIL_SECRET: ${SNAG_INBOUND_EMAIL_SECRET:-}
      # Scheduled backups into the backups volume
      SNAG_BACKUP_DIR: ${SNAG_BACKUP_DIR:-}
      SNAG_BACKUP_KEEP: ${SNAG_BACKUP_KEEP:-7}
      # Storage: a per-project attachment limit, and optional S3-compatible storage for media
      SNAG_PROJECT_STORAGE_MB: ${SNAG_PROJECT_STORAGE_MB:-0}
      SNAG_S3_BUCKET: ${SNAG_S3_BUCKET:-}
      SNAG_S3_ENDPOINT: ${SNAG_S3_ENDPOINT:-}
      SNAG_S3_REGION: ${SNAG_S3_REGION:-}
      SNAG_S3_ACCESS_KEY_ID: ${SNAG_S3_ACCESS_KEY_ID:-}
      SNAG_S3_SECRET_ACCESS_KEY: ${SNAG_S3_SECRET_ACCESS_KEY:-}
      SNAG_S3_PREFIX: ${SNAG_S3_PREFIX:-}
      # Prometheus scraping of /metrics
      SNAG_METRICS_TOKEN: ${SNAG_METRICS_TOKEN:-}

volumes:
  snag-data:
