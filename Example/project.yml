name: SnagExample
options:
  bundleIdPrefix: com.creaturesurvive
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${SNAG_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Snag:
    path: ..
targets:
  SnagExample:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources: [SnagExample]
    dependencies:
      - package: Snag
        product: Snag
      - package: Snag
        product: SnagUI
    info:
      path: SnagExample/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Snag Example
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creaturesurvive.SnagExample
  SnagExampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS]
    sources: [SnagExampleUITests]
    dependencies:
      - target: SnagExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creaturesurvive.SnagExampleUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SnagExample
schemes:
  SnagExample:
    build:
      targets:
        SnagExample: all
        SnagExampleUITests: [test]
    test:
      targets: [SnagExampleUITests]
