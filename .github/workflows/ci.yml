name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: String catalogs
        run: python3 Scripts/check-strings.py
      - name: Test
        run: swift test

  platforms:
    name: Build (iOS, tvOS, visionOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: xcodebuild build -scheme Snag-Package -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme Snag-Package -destination 'generic/platform=tvOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for visionOS
        run: xcodebuild build -scheme Snag-Package -destination 'generic/platform=visionOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet

  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Docker build
        run: docker build -t snag-server:ci .
